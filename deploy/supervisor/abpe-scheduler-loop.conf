; ABpE Scheduler-Loop — MUSS dauerhaft laufen (Taktgeber fuer email_index / MeetMe).
; Ohne diesen Prozess: keine periodischen SchedulerJob-Webhooks.
;
; Install (ucs5):
;   cp deploy/supervisor/abpe-scheduler-loop.conf /etc/supervisor/conf.d/
;   # oder: bash scripts/ENSURE-abpe-scheduler-loop.sh
;   supervisorctl reread && supervisorctl update
;   supervisorctl start abpe-scheduler-loop
;
; Pflicht-Flags: autostart=true + autorestart=true
; "STOPPED Not started" = Programm nie gestartet (oft autostart=false).

[program:abpe-scheduler-loop]
command=/opt/abpe/venv311/bin/python /opt/abpe/backend/manage.py scheduler_loop --interval=5 --heartbeat-every=60
directory=/opt/abpe/backend
; user= an Live-User anpassen falls nicht root
autostart=true
autorestart=true
startsecs=3
startretries=999
stopwaitsecs=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/abpe-scheduler-loop.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=DJANGO_SETTINGS_MODULE="abpe_backend.settings",PYTHONUNBUFFERED="1"
