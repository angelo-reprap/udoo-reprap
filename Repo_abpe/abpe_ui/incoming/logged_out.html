{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ current_lang|default:'de' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABpE Portal - {% trans "Abgemeldet" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-base.css' %}" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-login.css' %}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card text-center">
            <i class="bi bi-check-circle-fill text-success fs-1"></i>
            <h3 class="mt-3" data-i18n="logged_out_title">Erfolgreich abgemeldet</h3>
            <p class="text-muted" data-i18n="logged_out_message">Sie wurden erfolgreich abgemeldet.</p>
            <p class="text-muted" data-i18n="see_you_later">Auf Wiedersehen!</p>
            <hr>
            <a href="{% url 'abpe_ui:login' %}" class="btn btn-primary" data-i18n="login_again">Erneut anmelden</a>
        </div>
    </div>
    <script src="{% static 'abpe_ui/js/core/core-language.js' %}"></script>
</body>
</html>
