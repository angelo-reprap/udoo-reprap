{% extends 'abpe_ui/base.html' %}
{% load static %}
{% block title %}Benutzerhandbuch - Dokumentation{% endblock %}
{% block module_css %}
<link href="{% static 'abpe_ui/css/mod/mod-documentation.css' %}" rel="stylesheet">
{% endblock %}
{% block content %}
<div class="doc-container">
    <div class="toggle-section">
        <div class="section-header" onclick="toggleSection(this)">
            <span><i class="bi bi-list-ul"></i> <span data-i18n="doc.toc.title"></span></span>
            <i class="bi bi-chevron-down"></i>
        </div>
        <div class="section-content">
            <div class="toc-grid" id="toc-container"></div>
        </div>
    </div>
    <div id="chapters-container"></div>
</div>
{% endblock %}
{% block module_js %}
<script src="{% static 'abpe_ui/js/mod/mod-documentation.js' %}"></script>
{% endblock %}
{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof loadLanguage === 'function') {
            loadLanguage('{{ current_lang|default:"de" }}', 'documentation');
        }
    });
</script>
{% endblock %}
