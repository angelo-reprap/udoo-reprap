{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABpE Portal - Neues Passwort</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-base.css' %}" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-login.css' %}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{% static 'abpe_ui/img/logo.svg' %}" alt="ABpE">
                <h3>Neues Passwort vergeben</h3>
                <p class="text-muted">Bitte geben Sie Ihr neues Passwort ein</p>
            </div>

            {% if validlink %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Neues Passwort</label>
                    <input type="password" name="new_password1" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Passwort bestätigen</label>
                    <input type="password" name="new_password2" class="form-control" required>
                </div>
                {% if form.errors %}
                <div class="alert alert-danger">{{ form.errors }}</div>
                {% endif %}
                <button type="submit" class="btn btn-primary w-100">Passwort speichern</button>
            </form>
            {% else %}
            <div class="alert alert-danger">
                Dieser Link ist ungültig oder abgelaufen.
            </div>
            <a href="{% url 'abpe_ui:password_reset' %}" class="btn btn-primary w-100">Neuen Link anfordern</a>
            {% endif %}
        </div>
    </div>
</body>
</html>
