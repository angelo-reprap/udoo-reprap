{% load static i18n %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-base.css' %}" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-login.css' %}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="{% static 'abpe_ui/img/logo.svg' %}" alt="ABpE">
                <h3>Passwort zurücksetzen</h3>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="email" class="form-label">E-Mail Adresse</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                    <div class="form-text text-muted">
                        Sie erhalten einen Link zum Zurücksetzen Ihres Passworts.
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Link anfordern</button>
                
                <div class="text-center mt-3">
                    <a href="/login/" class="text-decoration-none">← Zurück zum Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
