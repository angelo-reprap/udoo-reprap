{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABpE Portal - Passwort geändert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-base.css' %}" rel="stylesheet">
    <link href="{% static 'abpe_ui/css/core/core-login.css' %}" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card text-center">
            <div class="login-logo">
                <img src="{% static 'abpe_ui/img/logo.svg' %}" alt="ABpE">
            </div>
            <div style="font-size:3rem;margin:16px 0;">✅</div>
            <h3>Passwort erfolgreich geändert!</h3>
            <p class="text-muted">Sie können sich jetzt mit Ihrem neuen Passwort anmelden.</p>
            <a href="{% url 'abpe_ui:login' %}" class="btn btn-primary w-100 mt-3">Jetzt anmelden</a>
        </div>
    </div>
</body>
</html>
