{% load static %}
<a href="{{ module.route }}"
   class="nav-link {% if active == module.id %}active{% endif %}"
   data-module="{{ module.id }}"
   data-titles="{{ module.titles_json|default:'{}' }}">
    <i class="bi bi-{{ module.icon }}"></i>
    <span class="nav-title">{{ module.title }}</span>
    {% if module.badge %}
    <span class="badge bg-danger ms-1" data-badge="{{ module.badge }}">0</span>
    {% endif %}
</a>
{% if module.subpages and active == module.id %}
<div class="submenu ms-4">
    {% for subpage in module.subpages %}
    <a href="{{ subpage.route }}"
       class="nav-link subpage-link"
       data-titles="{{ subpage.titles_json|default:'{}' }}">
        <i class="bi bi-arrow-right-short"></i>
        <span class="nav-title">{{ subpage.title }}</span>
    </a>
    {% endfor %}
</div>
{% endif %}
